name: Build and deploy

on:
  push:
    branches:
      - main # or master
  workflow_dispatch: # Allows manual trigger from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build:gh-pages

      - name: Handle SPA Routing (404 Fallback)
        # Copies index.html to 404.html so direct URL routing works on GitHub Pages
        run: cp dist/rusticone-fe/browser/index.html dist/rusticone-fe/browser/404.html

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/rusticone-fe/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
