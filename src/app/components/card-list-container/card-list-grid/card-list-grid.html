<div class="card-grid" data-testId="Card List Container - Grid">
  @if (hasResolvedItems()) {
    @for (item of items(); track trackBy(item, $index)) {
      @if (cardTemplate(); as tpl) {
        <ng-container *ngTemplateOutlet="tpl; context: { $implicit: item, item: item }" />
      } @else {
        <app-generic-card
          [payload]="asPayload(item)"
          [actions]="actions()"
          [layout]="cardConfig()?.layout ?? 'vertical'"
          [size]="cardConfig()?.size ?? 'regular'"
          [round]="cardConfig()?.round ?? 'regular'"
          [actionsDisplay]="cardConfig()?.actionsDisplay ?? 'auto'"
          [actionAlwaysVisible]="cardConfig()?.actionAlwaysVisible ?? false"
          [showImgeDetail]="cardConfig()?.showImgeDetail ?? false"
          [footerClass]="cardConfig()?.footerClass ?? ''"
          (action)="onCardAction($event)"
          data-testId="Card List Container - Generic card"
        />
      }
    }
  } @else {
    <ng-content />
  }
</div>
