<div class="login-page">
  <!-- Top decorative accent line -->
  <div class="top-accent-bar"></div>

  <!-- Decorative soft organic background shapes -->
  <div class="bg-shape bg-shape-top"></div>
  <div class="bg-shape bg-shape-middle"></div>
  <div class="bg-shape bg-shape-bottom"></div>

  <!-- Main Login Container -->
  <main class="login-container">
    <!-- Brand Logo -->
    <div class="logo-wrapper">
      <div class="logo-squircle">
        <div class="logo-inner">
          <img src="main-logo.png" alt="Il Rusticone Logo" class="logo-image" />
        </div>
      </div>
    </div>

    <!-- Brand Typography Header -->
    <header class="login-header">
      <h1 class="brand-title">Il Rusticone</h1>
      <p class="brand-tagline">
        <span>I buffet più buoni della città</span>
        <span role="img" aria-label="pizza">🍕</span>
      </p>
    </header>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Username Fieldset -->
      <fieldset class="fieldset w-full">
        <label class="label form-label" for="username"> Nome utente </label>
        <div class="input-wrapper">
          <span class="input-icon-left">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="field-icon"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.75"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"
              />
            </svg>
          </span>
          <input
            type="text"
            id="username"
            formControlName="username"
            class="input form-input"
            placeholder="es. mario.rossi"
            autocomplete="username"
          />
        </div>
        @if (usernameError()) {
          <span class="form-error">{{ usernameError() }}</span>
        }
      </fieldset>

      <!-- Password Fieldset -->
      <fieldset class="fieldset w-full">
        <label class="label form-label" for="password"> Password </label>
        <div class="input-wrapper">
          <span class="input-icon-left">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="field-icon"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.75"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"
              />
            </svg>
          </span>
          <input
            [type]="showPassword() ? 'text' : 'password'"
            id="password"
            formControlName="password"
            class="input form-input form-input-password"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <button
            type="button"
            (click)="togglePassword()"
            class="password-toggle-btn"
            [attr.aria-label]="showPassword() ? 'Nascondi password' : 'Mostra password'"
          >
            @if (showPassword()) {
              <!-- Eye Off Icon -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="field-icon"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.75"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"
                />
              </svg>
            } @else {
              <!-- Eye Icon -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="field-icon"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.75"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
              </svg>
            }
          </button>
        </div>
        @if (passwordError()) {
          <span class="form-error">{{ passwordError() }}</span>
        }
      </fieldset>

      <!-- Submit Button -->
      <button type="submit" [disabled]="isLoading()" class="submit-btn">
        @if (isLoading()) {
          <span class="loading loading-spinner loading-sm" aria-hidden="true"></span>
          <span>Accesso in corso...</span>
        } @else {
          <span>Accedi</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="btn-arrow-icon"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2.5"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"
            />
          </svg>
        }
      </button>
    </form>

    <!-- Alternative Auth Actions -->
    <div class="auth-divider">
      <span class="divider-line"></span>
      <span class="divider-text">oppure</span>
      <span class="divider-line"></span>
    </div>

    <div class="secondary-actions">
      <!-- Google Sign In Button -->
      <button type="button" (click)="onGoogleSignIn()" class="google-btn">
        <svg
          class="google-icon"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            fill="#4285F4"
          />
          <path
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            fill="#34A853"
          />
          <path
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
            fill="#FBBC05"
          />
          <path
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
            fill="#EA4335"
          />
        </svg>
        <span>Entra con Google</span>
      </button>

      <!-- Manual Registration Action -->
      <div class="register-row">
        <span>Non hai un account?</span>
        <button type="button" (click)="onRegister()" class="register-link-btn">Registrati</button>
      </div>
    </div>
  </main>
</div>
