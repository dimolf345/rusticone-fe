<div class="not-found-page hero">
  <!-- Top decorative accent line -->
  <div class="top-accent-bar"></div>

  <!-- Decorative background shapes -->
  <div class="bg-shape bg-shape-top"></div>
  <div class="bg-shape bg-shape-middle"></div>
  <div class="bg-shape bg-shape-bottom"></div>

  <div class="hero-content not-found-content">
    <app-main-logo />

    <div class="message-card">
      <div class="status-code">404</div>

      <h2 class="error-title">Ooops, hai sbagliato pagina!</h2>

      <p class="error-description">
        Sembra che tu sia finito fuori menù. La pagina che cerchi non esiste o è stata spostata.
      </p>

      <div class="action-wrapper">
        <a [routerLink]="paths.ROOT" class="home-btn">
          <ng-icon size="1.25rem" name="heroHome" class="btn-icon" />
          <span>Torna alla Home</span>
        </a>
      </div>
    </div>
  </div>
</div>
